name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "cyberlog-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/cyberlog.exe $name/
          Copy-Item target/release/cyberlog-launcher.exe "$name/Start Cyberlog.exe"
          Set-Content -Path "$name/portable.txt" -Value "Portable mode: Cyberlog keeps its journal data and logs in the data folder next to this file. Double-click 'Start Cyberlog.exe'. Delete this file and the data folder to use %LOCALAPPDATA%\cyberlog instead."
          Copy-Item bin/cyberlog.bat $name/
          Copy-Item -Recurse web $name/web
          Copy-Item -Recurse assets $name/assets
          Copy-Item README.md $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $version = "${{ github.ref_name }}".TrimStart("v")
          & $iscc "/DAppVersion=$version" installer\cyberlog.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "dist\Cyberlog-Setup-v$version.exe" .
          "SETUP=Cyberlog-Setup-v$version.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="cyberlog-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$name/bin" "$name/target/release"
          cp target/release/cyberlog "$name/target/release/"
          cp bin/cyberlog "$name/bin/"
          cp -r web assets README.md cyberlog.desktop "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.SETUP }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" -R "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" -R "${{ github.repository }}" --title "Cyberlog ${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" dist/* -R "${{ github.repository }}" --clobber
